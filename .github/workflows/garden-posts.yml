name: Update Thinking Garden entries

on:
  schedule:
    # 07:00 KST. 가든 배포가 예약은 04:00 KST지만 러너 대기로 06:30 무렵에 도니 그 뒤에 피드를 읽는다.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update Thinking Garden posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://taez224.github.io/feeds/posts.xml"
          max_post_count: 2
          comment_tag_name: "GARDEN-POST-LIST"
          tag_post_pre_newline: true
          template: "- [글] [$title]($url)$newline"
      - name: Update Thinking Garden notes
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://taez224.github.io/feeds/notes.xml"
          max_post_count: 1
          comment_tag_name: "GARDEN-NOTE-LIST"
          tag_post_pre_newline: true
          template: "- [노트] [$title]($url)$newline"
      - name: Update Thinking Garden development notes
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://taez224.github.io/feeds/dev.xml"
          max_post_count: 1
          comment_tag_name: "GARDEN-DEV-LIST"
          tag_post_pre_newline: true
          template: "- [개발 노트] [$title]($url)$newline"
